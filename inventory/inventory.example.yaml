# =============================================================================
#  cx-mcp — Switch inventory (TEMPLATE)
# =============================================================================
#  cp inventory/inventory.example.yaml inventory/inventory.yaml
#  (inventory.yaml is git-ignored: it holds real IPs.)
#
#  The file has 3 steps. Only steps 1 and 2 are required.
#
#    STEP 1  source     WHERE the switch list comes from      (required)
#    STEP 2  defaults   HOW to connect to every switch        (required)
#    STEP 3  devices    The switch list itself                (only if source = local)
#
#    Optional: sources (NetBox/Nautobot/Infrahub connection), vault, sites
#
#  Changes are picked up without restart:
#    docker compose exec hpe-cx-mcp python security/cx_reload.py
# =============================================================================


# -----------------------------------------------------------------------------
# STEP 1 — Where does the switch list come from?
# -----------------------------------------------------------------------------
#   source: local                You list the switches yourself (STEP 3).
#   source: netbox               Taken from NetBox    -> see "sources" below.
#   source: nautobot             Taken from Nautobot  -> see "sources" below.
#   source: infrahub             Taken from Infrahub  -> see "sources" below.
#   source: [local, netbox]      Both merged. If a switch is in both, the FIRST
#                                source of the list wins.
#
#   Note: when "local" is NOT in the list, the "devices:" block is ignored.
# -----------------------------------------------------------------------------
source: local


# -----------------------------------------------------------------------------
# STEP 2 — Connection settings applied to EVERY switch (any source)
# -----------------------------------------------------------------------------
#  A switch entry (STEP 3) or a NetBox/Infrahub record can override any of them.
#  A key left out falls back to the environment variable shown in brackets.
#
#  Keep secrets OUT of this file: put the password in .env
#  (ARUBA_DEFAULT_PASSWORD) or use Vault (see end of file).
# -----------------------------------------------------------------------------
defaults:
  username: admin           # [ARUBA_DEFAULT_USERNAME]
  # password: ...           # [ARUBA_DEFAULT_PASSWORD] -> keep it in .env
  api_version: latest       # [ARUBA_API_VERSION] "latest" = auto-detect per switch.
                            #   Use it if firmware versions are mixed. Or pin: v10.13
  verify_ssl: false         # [ARUBA_VERIFY_SSL] false = accept self-signed certs (lab)
  timeout: 30               # REST timeout in seconds
  access_mode: read-only    # read-only  = the MCP can only read
                            # read-write = the MCP may push configuration

  # Rarely needed:
  # ssh_port: 22            # [ARUBA_SSH_PORT]
  # ssh_username: ...       # default: same as username
  # ssh_password: ...       # default: same as password
  # site: my-site           # site given to switches that have none


# -----------------------------------------------------------------------------
# STEP 3 — Switch list (used ONLY if "local" is in source)
# -----------------------------------------------------------------------------
#  Minimal entry : the name, and the IP or DNS name.
#        Core-01: 192.0.2.10
#
#  Full entry (every key is optional except host):
#        Core-01:
#          host: 192.0.2.10              IP or DNS name           (required)
#          site: campus                  groups switches: tools accept site=...
#          tags: [core, campus]          free labels, used by find_devices
#          description: "Core switch"    free text
#          access_mode: read-write       overrides defaults (see STEP 2)
#          username / password / api_version / verify_ssl / timeout / ssh_*
#                                        overrides defaults (see STEP 2)
#          vault: true                   read this switch's credentials from Vault
#
#  IPs below are documentation ranges (RFC 5737): replace them.
# -----------------------------------------------------------------------------
devices:

  Core-01:
    host: 192.0.2.10
    site: campus
    tags: [core, campus]
    description: "Core switch"
    access_mode: read-write

  Access-01:
    host: 192.0.2.20
    site: campus
    tags: [access, campus]
    description: "Access switch - floor 1"

  Access-02: 192.0.2.21               # minimal form (no site, no tags)

  Leaf-01:
    host: 203.0.113.10
    site: dc
    tags: [leaf, dc]
    description: "DC Leaf 1"


# =============================================================================
#  OPTIONAL BLOCKS — uncomment only what you need
# =============================================================================

# -----------------------------------------------------------------------------
# sources — Connection to NetBox / Nautobot / Infrahub
# -----------------------------------------------------------------------------
#  Only needed when STEP 1 uses netbox, nautobot or infrahub.
#  Simplest: set the URL/token in .env and add NOTHING here:
#     NetBox   -> NETBOX_URL   + NETBOX_TOKEN
#     Nautobot -> NAUTOBOT_URL + NAUTOBOT_TOKEN
#     Infrahub -> INFRAHUB_URL + INFRAHUB_TOKEN
#  Add a block below only to change the defaults (TLS, timeout, Infrahub schema).
#  The block name must match the name used in STEP 1.
# -----------------------------------------------------------------------------
# sources:
#
#   netbox:
#     url: https://netbox.example.com     # or NETBOX_URL
#     verify_ssl: false                   # NetBox uses a self-signed cert
#     timeout: 15
#
#   infrahub:
#     url: https://infrahub.example.com   # or INFRAHUB_URL
#     branch: main
#     device_kind: DcimDevice             # node type that holds the switches
#     # Extra fields shown on each switch ("rel:attr" reads a given attribute).
#     metadata_relationships: ["location:shortname", "zone"]
#     # find_devices criterion -> GraphQL filter of YOUR Infrahub schema.
#     filter_map:
#       device_group: device_groups__name__value
#       location:     location__shortname__value
#       site:         location__shortname__value
#       rack:         location__shortname__value
#       zone:         zone__name__value

# -----------------------------------------------------------------------------
# vault — Read switch credentials from HashiCorp Vault
# -----------------------------------------------------------------------------
#  Credential priority: switch entry  >  Vault  >  defaults  >  .env
#  VAULT_ADDR + VAULT_TOKEN come from .env. Secret path = "secret/<switch name>",
#  with keys username / password (/ ssh_username / ssh_password).
# -----------------------------------------------------------------------------
# vault: true                 # all switches
#
# vault:                      # same, with explicit settings
#   mount: secret
#   kv_version: 2
#   path_template: "{device}"

# -----------------------------------------------------------------------------
# sites — Other way to write STEP 3: switches grouped by site
# -----------------------------------------------------------------------------
#  Same result as setting "site:" on every switch. A site can also override
#  username / password / api_version / verify_ssl / timeout / ssh_* / access_mode.
# -----------------------------------------------------------------------------
# sites:
#   campus:
#     access_mode: read-write
#     devices:
#       Core-01: 192.0.2.10
#       Access-01: 192.0.2.20
#   dc:
#     devices:
#       Leaf-01: 203.0.113.10
